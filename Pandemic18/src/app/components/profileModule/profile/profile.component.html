<div class="h-dvh flex justify-center">
    <div class="flex flex-col justify-center items-center relative z-10">
        <!--Profile -->
        <div class="md:grid md:grid-cols-2 xl:grid-cols-1 rounded-md border-emerald-900 m-4 
                text-white p-4 bg-[#388bff] md:ml-10 md:mr-10 border-2">
            <div>
                <!--Name-->
                <div class="grid grid-cols-3 text-center">
                    <div></div>
                    <h1 class="text-3xl border-2 rounded-md shadow-md p-1 m-2 
                        border-emerald-950 bg-[#265dab]">
                        {{profile.name}}
                    </h1>
                    <div></div>
                </div>
                <!--Picture-->
                <a class="flex self-center justify-center cursor-pointer hover:[&>*]:border-black duration-150"
                    (click)="setVisible()">
                    <img class="rounded-full border-2 border-emerald-900 bg-[#265dab]" src="{{profile.profilePic}}" alt="" height="256px" width="256px">
                </a>
                @if(profile.profilePic==null){
                    <div class="text-center">Selecciona tu foto de perfil</div>
                }
            </div>
            <!--Profile data add more rows if needed-->
            <div class="flex flex-col text-center justify-center text-xl m-4">
                <div class="grid grid-cols-1 md:grid-cols-1">
                    <div>Puntuacion: {{profile.puntuacion}}</div>
                </div>
            </div>
        </div>
        <!--nav bar-->
        <div class="grid grid-cols-3 sm:grid-cols-3 md:flex md:flex-row md:justify-center sm:gap-0 gap-5 
                    bg-[#00afff] md:ml-10 md:mr-10 mt-2 m-4 text-center p-4 rounded-md border-4 border-[#388bff]">
            <div>
                <button (click)="goToInicio()" class="border-2 border-emerald-950 pl-4 pr-4 rounded-md p-2 
                bg-[#388bff] text-emerald-100 shadow-sm 
                shadow-black hover:pr-6 hover:pl-6
                duration-150 cursor-pointer hover:bg-emerald-200 
                hover:text-emerald-950 md:ml-4 md:mr-4">Inicio</button>
            </div>
            <div>
                <button (click)="goLogout()" class="border-2 border-emerald-950 pl-4 pr-4 rounded-md p-2 
                bg-[#388bff] text-emerald-100 shadow-sm 
                shadow-black hover:pr-6 hover:pl-6 
                duration-150 cursor-pointer hover:bg-emerald-200 
                hover:text-emerald-950 md:ml-4 md:mr-4">Logout</button>
            </div>
            <div>
                <button (click)="goToRanking()" class="border-2 border-emerald-950 pl-4 pr-4 rounded-md p-2 
                bg-[#388bff] text-emerald-100 shadow-sm 
                shadow-black hover:pr-6 hover:pl-6 
                duration-150 cursor-pointer hover:bg-emerald-200 
                hover:text-emerald-950 md:ml-4 md:mr-4">Ranking</button>

            </div>
        </div>
    </div>
</div>



    
@if(this.isVisible){
    <div class="absolute inset-0 z-50 m-10 border-2 rounded-md border-emerald-950 shadow-md bg-[#388bff] h-4/6 md:h-4/5">
        <div class="border-2 rounded-md border-emerald-200 text-center text-emerald-200 bg-[#388bff]">
            <h1 class="text-2xl">Selecciona tu foto de perfil</h1>
        </div>
        <div class="grid grid-cols-3 md:grid-cols-5  md:gap-10 gap-5">
            @for(pic of this.profilePics; track pic.src){
                <a (click)="selectPic(pic.src)" class="hover:[&>*]:bg-emerald-300 hover:[&>*]:border-emerald-950 flex justify-center">
                    <img class="rounded-full border-2 border-emerald-900 bg-emerald-800 h-16 w-16 md:h-32 md:w-32" src="{{pic.src}}" alt="">
                </a>
            }
        </div>
    </div>
    }
